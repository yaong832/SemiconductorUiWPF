name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build SemiconductorUi.Wpf.sln -c Release
      - run: dotnet test SemiconductorUi.Wpf.sln -c Release --no-build
      # 화면 모양 확인용 스냅샷 (실장비 없이 렌더링)
      - name: Render UI snapshots
        run: dotnet run --project tools/SnapshotTool -c Release --no-build -- snapshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-snapshots
          path: snapshots/
          if-no-files-found: warn
