name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build SemiconductorUi.Wpf.sln -c Release
      - run: dotnet test SemiconductorUi.Wpf.sln -c Release --no-build
      # 화면 모양 확인용 스냅샷 (실장비 없이 렌더링)
      - name: Render UI snapshots
        run: dotnet run --project tools/SnapshotTool -c Release --no-build -- snapshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-snapshots
          path: snapshots/
          if-no-files-found: warn
      # 스냅샷을 ci-snapshots 브랜치에도 올려 GitHub에서 바로 볼 수 있게 한다 (같은 리포의 PR만)
      - name: Publish snapshots to ci-snapshots branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          dest="pr-${{ github.event.pull_request.number }}"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch origin ci-snapshots || true
          if git rev-parse --verify origin/ci-snapshots >/dev/null 2>&1; then
            git worktree add ../snap origin/ci-snapshots
            git -C ../snap checkout -B ci-snapshots
          else
            git worktree add --detach ../snap
            git -C ../snap checkout --orphan ci-snapshots
            git -C ../snap rm -rf . >/dev/null
          fi
          rm -rf "../snap/$dest" && mkdir -p "../snap/$dest"
          cp snapshots/*.png "../snap/$dest/"
          git -C ../snap add -A
          git -C ../snap commit -m "UI snapshots for $dest (${{ github.event.pull_request.head.sha }})" || exit 0
          git -C ../snap push origin ci-snapshots
